l<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bank Arbolii - System YA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e8f5e9; color: #2e7d32; display: flex; flex-direction: column; align-items: center; }
        .bank-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; margin-top: 20px; }
        h1 { text-align: center; border-bottom: 2px solid #4caf50; padding-bottom: 10px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #4caf50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #388e3c; }
        .offer { background: #f1f8e9; padding: 15px; margin: 10px 0; border-left: 5px solid #81c784; position: relative; }
        .admin-offer { border-left-color: #ff9800; background: #fff3e0; }
        .delete-btn { background: #e53935; width: auto; padding: 4px 8px; font-size: 11px; float: right; }
        .buy-btn { background: #007bff; margin-top: 10px; }
        .news-box { background: #fff9c4; border: 1px solid #fbc02d; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .hidden { display: none; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>

    <h1>🌳 Bank Arbolii</h1>

    <!-- Logowanie -->
    <div id="auth-box" class="bank-container">
        <h3>Zaloguj się do Arbolii</h3>
        <input type="text" id="username" placeholder="Nick (Szef: SBiPP)">
        <input type="password" id="password" placeholder="Hasło">
        <button onclick="login()">Otwórz Bramy Lasu</button>
    </div>

    <!-- Panel Użytkownika -->
    <div id="user-panel" class="bank-container hidden">
        <div id="news-section" class="news-box hidden">
            <strong>🔔 NEWSY:</strong>
            <ul id="news-list" style="margin: 5px 0; padding-left: 20px; font-size: 0.9em;"></ul>
            <button onclick="clearNews()" style="padding: 2px; font-size: 10px; background: #fbc02d;">Wyczyść powiadomienia</button>
        </div>

        <h3>Witaj, <span id="display-nick"></span>!</h3>
        <p>Twoje YA: <strong style="font-size: 1.5em;"><span id="balance"></span> YA</strong></p>
        
        <hr>
        <h4>Wystaw nową ofertę</h4>
        <input type="text" id="offer-title" placeholder="Co sprzedajesz?">
        <input type="number" id="offer-price" placeholder="Cena w YA">
        <button onclick="addOffer()">Opublikuj w Kraju</button>

        <hr>
        <h4>Szybki przelew YA</h4>
        <input type="text" id="transfer-to" placeholder="Odbiorca">
        <input type="number" id="transfer-amount" placeholder="Kwota">
        <button onclick="sendMoney()" style="background:#2e7d32">Wyślij liście</button>
        
        <button onclick="logout()" style="background:#999; margin-top: 20px;">Wyloguj</button>
    </div>

    <!-- Market -->
    <div id="market-box" class="bank-container hidden">
        <h3>Sklepy Arbolii</h3>
        <div id="offers-list"></div>
    </div>

<script>
    // System przechowuje dane w sesji (znikają po zamknięciu karty)
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('arbolia_users')) || {
        "SBiPP": { password: "No67", balance: 999999, isAdmin: true, news: [] }
    };
    let offers = JSON.parse(localStorage.getItem('arbolia_offers')) || [];

    function save() {
        localStorage.setItem('arbolia_users', JSON.stringify(users));
        localStorage.setItem('arbolia_offers', JSON.stringify(offers));
    }

    function login() {
        const nick = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (!users[nick]) {
            users[nick] = { password: pass, balance: 100, isAdmin: false, news: [] };
        }

        if (users[nick].password === pass) {
            currentUser = nick;
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('user-panel').classList.remove('hidden');
            document.getElementById('market-box').classList.remove('hidden');
            document.getElementById('display-nick').innerText = currentUser;
            updateUI();
        } else {
            alert("Złe hasło!");
        }
    }

    function updateUI() {
        document.getElementById('balance').innerText = users[currentUser].balance.toFixed(2);
        
        // Obsługa Newsów
        const newsSection = document.getElementById('news-section');
        const newsList = document.getElementById('news-list');
        if (users[currentUser].news && users[currentUser].news.length > 0) {
            newsSection.classList.remove('hidden');
            newsList.innerHTML = users[currentUser].news.map(n => `<li>${n}</li>`).join('');
        } else {
            newsSection.classList.add('hidden');
        }

        // Rynek
        const list = document.getElementById('offers-list');
        list.innerHTML = "";

        offers.forEach((off, index) => {
            const div = document.createElement('div');
            div.className = `offer ${off.owner === 'SBiPP' ? 'admin-offer' : ''}`;
            
            let actionButtons = "";
            
            // Przycisk Kupna (tylko u innych)
            if (off.owner !== currentUser) {
                actionButtons += `<button class="buy-btn" onclick="buyOffer(${index})">KUP ZA ${off.price} YA</button>`;
            }

            // Przycisk Usuwania (Szef może wszystko, inni swoje)
            if (currentUser === 'SBiPP' || off.owner === currentUser) {
                actionButtons += `<button class="delete-btn" onclick="deleteOffer(${index})">USUŃ</button>`;
            }

            div.innerHTML = `
                ${actionButtons}
                <strong>${off.owner === 'SBiPP' ? '🏛️ [PAŃSTWOWE]' : '🌲'} ${off.title}</strong><br>
                <small>Sprzedawca: ${off.owner} | Cena: ${off.price} YA</small>
            `;
            list.appendChild(div);
        });
        save();
    }

    function addOffer() {
        const title = document.getElementById('offer-title').value;
        const price = parseFloat(document.getElementById('offer-price').value);
        if(title && price > 0) {
            offers.push({ owner: currentUser, title: title, price: price });
            updateUI();
        }
    }

    function buyOffer(index) {
        const off = offers[index];
        const buyer = users[currentUser];
        const seller = users[off.owner];

        if (buyer.balance >= off.price) {
            buyer.balance -= off.price;
            seller.balance += off.price;
            
            // Dodawanie Newsa sprzedawcy
            const msg = `💰 Ktoś kupił "${off.title}" za ${off.price} YA!`;
            seller.news.push(msg);
            
            alert("Kupiono pomyślnie!");
            offers.splice(index, 1); // Usuń po zakupie
            updateUI();
        } else {
            alert("Masz za mało YA!");
        }
    }

    function deleteOffer(index) {
        offers.splice(index, 1);
        updateUI();
    }

    function sendMoney() {
        const to = document.getElementById('transfer-to').value;
        const amt = parseFloat(document.getElementById('transfer-amount').value);

        if (users[to] && users[currentUser].balance >= amt) {
            users[currentUser].balance -= amt;
            users[to].balance += amt;
            users[to].news.push(`💸 Otrzymałeś przelew: ${amt} YA od ${currentUser}`);
            updateUI();
        }
    }

    function clearNews() {
        users[currentUser].news = [];
        updateUI();
    }

    function logout() { location.reload(); }
</script>
</body>
</html>
